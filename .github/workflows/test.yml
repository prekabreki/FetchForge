name: test

on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Python tests
        run: python -m unittest discover -s tests -v

      - name: Tool tests
        run: python -m unittest discover -s tools/tests -v

      - name: Lint
        run: ruff check fetchforge tests tools

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/frontend/package-lock.json

      - name: Install frontend test dependencies
        run: npm --prefix tests/frontend ci

      - name: Frontend tests
        run: npm --prefix tests/frontend test

      - name: Frontend mutation check
        run: npm --prefix tests/frontend run test:mutations
